
extends:
  - spectral:oas

rules:
  operation-operationId: error

  no-content-for-204:
    description: "Response 204 must not have content"
    severity: error
    given: "$.paths[*][*].responses['204']"
    then:
      field: content
      function: falsy

  book-year-integer:
    description: "Book.year must be integer"
    severity: error
    given: "$.components.schemas.Book.properties.year"
    then:
      field: type
      function: enumeration
      functionOptions:
        values:
          - integer

  response-200-nonempty-schema:
    description: "Response 200 must define a non-empty schema"
    message: "Response 200 must have a non-empty schema"
    severity: error
    given: "$.paths[*][*].responses['200'].content.*.schema"
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - type: object
              required: [properties]
              properties:
                properties:
                  type: object
                  minProperties: 1
            - type: object
              required: [items]
              properties:
                items:
                  type: object
                  minProperties: 1
            - type: object
              required: ["$ref"]
              properties:
                "$ref":
                  type: string
                  minLength: 1
