extends: ["spectral:oas"]

rules:
  operation-operationId: error

  no-content-for-204:
    description: "Response 204 must not have content"
    severity: error
    given: "$.paths[*][*].responses['204']"
    then:
      field: content
      function: falsy

  book-year-integer:
    description: "Book.year must be integer"
    severity: error
    given: "$.components.schemas.Book.properties.year"
    then:
      field: type
      function: enumeration
      functionOptions:
        values:
          - integer