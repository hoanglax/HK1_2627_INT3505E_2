
openapi: 3.0.3

info:
  title: User API
  version: 2.0.0
  description: API Versioning Lab 01

servers:
  - url: http://127.0.0.1:5000

paths:
  /api/v1/{uid}:
    get:
      summary: Get user v1
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User with full_name
        '404':
          description: User not found

  /api/v2/{uid}:
    get:
      summary: Get user v2
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User with first_name and last_name
        '404':
          description: User not found

  /api/v2/:
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: User created
        '400':
          description: Invalid request
